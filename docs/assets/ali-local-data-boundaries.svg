<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Ali local data and trust boundaries</title>
  <desc id="desc">Local data boundaries showing app install output, LocalAppData stores, Ollama, voice resources, and Smart App Control signing boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .trust { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 14; }
      .local { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .data { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 10; }
      .warn { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .no { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Segoe UI, Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="40" y="46">Local data and trust boundaries</text>
  <text class="text" x="40" y="74">Ali V1 keeps runtime, data, speech assets, and signing boundaries explicit.</text>

  <rect class="trust" x="45" y="120" width="1110" height="525"/>
  <text class="label" x="70" y="154">Chris's Windows user profile</text>

  <rect class="local" x="85" y="205" width="220" height="115"/>
  <text class="label" x="112" y="238">Ali executable</text>
  <text class="text" x="112" y="266">Signed debug output</text>
  <text class="text" x="112" y="288">DevRun pending repair</text>

  <rect class="warn" x="85" y="395" width="220" height="115"/>
  <text class="label" x="112" y="428">Smart App Control</text>
  <text class="text" x="112" y="456">Dev cert trusted only in</text>
  <text class="text" x="112" y="478">CurrentUser\Root</text>

  <rect class="data" x="390" y="155" width="285" height="140"/>
  <text class="label" x="420" y="190">BootstrapData</text>
  <text class="text" x="420" y="218">runtime-settings.json</text>
  <text class="text" x="420" y="240">voice-settings.json</text>
  <text class="text" x="420" y="262">runtime-health.log</text>

  <rect class="data" x="390" y="350" width="285" height="140"/>
  <text class="label" x="420" y="385">Local stores</text>
  <text class="text" x="420" y="413">Conversations</text>
  <text class="text" x="420" y="435">Correction queue</text>
  <text class="text" x="420" y="457">Memories and reminders</text>

  <rect class="local" x="760" y="155" width="300" height="140"/>
  <text class="label" x="790" y="190">Ollama endpoint</text>
  <text class="text" x="790" y="218">http://127.0.0.1:11434/v1/</text>
  <text class="text" x="790" y="240">qwen3-vl:8b</text>
  <text class="text" x="790" y="262">No cloud fallback</text>

  <rect class="local" x="760" y="350" width="300" height="140"/>
  <text class="label" x="790" y="385">lib\voice</text>
  <text class="text" x="790" y="413">Faster-Whisper cache</text>
  <text class="text" x="790" y="435">Piper voices</text>
  <text class="text" x="790" y="457">Live certification pending</text>

  <rect class="no" x="390" y="545" width="670" height="70"/>
  <text class="label" x="420" y="578">Forbidden V1 exits</text>
  <text class="text" x="420" y="600">No public runtime endpoint, no cloud speech, no command execution, no LocalMachine Root trust change.</text>

  <path class="line" d="M 305 250 L 390 225"/>
  <path class="line" d="M 305 275 L 390 410"/>
  <path class="line" d="M 675 225 L 760 225"/>
  <path class="dash" d="M 305 452 L 390 225"/>
  <path class="dash" d="M 305 452 L 760 225"/>
  <path class="dash" d="M 305 452 L 760 410"/>
  <path class="line" d="M 910 350 L 910 295"/>

  <text class="small" x="322" y="230">settings/logs</text>
  <text class="small" x="322" y="352">chat data</text>
  <text class="small" x="690" y="214">local HTTP</text>
  <text class="small" x="330" y="500">signing boundary</text>
</svg>
