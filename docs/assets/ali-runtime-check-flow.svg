<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Ali runtime check and activation flow</title>
  <desc id="desc">Runtime settings check, local endpoint policy, health probe, activation gate, failure path, and runtime health log.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 10; }
      .blue { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 10; }
      .green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 10; }
      .red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 10; }
      .yellow { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 10; }
      .title { font: 700 24px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 16px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px Segoe UI, Arial, sans-serif; fill: #334155; }
      .small { font: 12px Segoe UI, Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect class="bg" width="1200" height="700"/>
  <text class="title" x="40" y="46">Runtime check and activation</text>
  <text class="text" x="40" y="74">Ali stays on the deterministic stub until the local runtime passes health check and the user explicitly activates it.</text>

  <rect class="blue" x="45" y="140" width="210" height="115"/>
  <text class="label" x="72" y="174">Settings UI</text>
  <text class="text" x="72" y="202">Endpoint</text>
  <text class="text" x="72" y="222">Model</text>
  <text class="text" x="72" y="242">Low runtime settings</text>

  <rect class="box" x="320" y="140" width="220" height="115"/>
  <text class="label" x="346" y="174">LocalEndpointPolicy</text>
  <text class="text" x="346" y="202">Allow loopback</text>
  <text class="text" x="346" y="222">Reject public/cloud URL</text>

  <rect class="box" x="610" y="120" width="235" height="155"/>
  <text class="label" x="638" y="154">Health probes</text>
  <text class="text" x="638" y="182">GET /v1/models</text>
  <text class="text" x="638" y="204">POST /chat/completions</text>
  <text class="text" x="638" y="226">stream probe</text>
  <text class="text" x="638" y="248">vision probe if enabled</text>

  <rect class="green" x="920" y="120" width="220" height="155"/>
  <text class="label" x="948" y="154">Ollama</text>
  <text class="text" x="948" y="182">127.0.0.1:11434</text>
  <text class="text" x="948" y="204">qwen3-vl:8b</text>
  <text class="text" x="948" y="226">OpenAI-compatible</text>

  <rect class="yellow" x="320" y="380" width="220" height="115"/>
  <text class="label" x="346" y="414">runtime-health.log</text>
  <text class="text" x="346" y="442">request</text>
  <text class="text" x="346" y="462">response/status</text>
  <text class="text" x="346" y="482">exception detail</text>

  <rect class="green" x="610" y="380" width="235" height="115"/>
  <text class="label" x="638" y="414">PASS</text>
  <text class="text" x="638" y="442">Activate enabled</text>
  <text class="text" x="638" y="462">User clicks Activate</text>
  <text class="text" x="638" y="482">Active runtime changes</text>

  <rect class="red" x="920" y="380" width="220" height="115"/>
  <text class="label" x="948" y="414">FAIL</text>
  <text class="text" x="948" y="442">Failure text visible</text>
  <text class="text" x="948" y="462">Activate disabled</text>
  <text class="text" x="948" y="482">Stub remains active</text>

  <rect class="blue" x="610" y="565" width="235" height="75"/>
  <text class="label" x="638" y="598">Normal chat</text>
  <text class="text" x="638" y="622">Streams through local model</text>

  <path class="line" d="M 255 198 L 320 198"/>
  <path class="line" d="M 540 198 L 610 198"/>
  <path class="line" d="M 845 198 L 920 198"/>
  <path class="dash" d="M 730 275 L 730 380"/>
  <path class="dash" d="M 430 255 L 430 380"/>
  <path class="line" d="M 845 438 L 920 438"/>
  <path class="line" d="M 728 495 L 728 565"/>
  <path class="line" d="M 610 438 L 540 438"/>
  <path class="line" d="M 610 438 C 570 350, 900 350, 920 438"/>

  <text class="small" x="267" y="187">Check</text>
  <text class="small" x="552" y="187">validate</text>
  <text class="small" x="858" y="187">localhost HTTP</text>
  <text class="small" x="741" y="333">health result</text>
  <text class="small" x="448" y="333">diagnostics</text>
</svg>
